<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Gauhar Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    background:#000;
}

.scene{
    width:100vw;
    height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#020024,#090979,#00d4ff);
    transition:all 1.5s ease;
}

.text{
    color:white;
    font-size:4rem;
    font-weight:700;
    text-align:center;
    text-shadow:0 0 20px rgba(255,255,255,0.8);
    opacity:0;
    transform:translateY(100px);
    animation:intro 2s forwards;
}

@keyframes intro{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.landscape{
    position:absolute;
    bottom:-100%;
    width:100%;
    height:100%;
    background:
    linear-gradient(to top,#062a0a 0%,#0f5132 25%,transparent 26%),
    linear-gradient(to top,#1c1c1c 0%,transparent 40%);
    transition:all 2s ease;
}

.mountain{
    position:absolute;
    bottom:0;
    width:100%;
    height:50%;
    background:
    polygon;
}

.sun{
    position:absolute;
    width:140px;
    height:140px;
    border-radius:50%;
    background:#ffd700;
    top:15%;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 0 60px #ffd700;
    opacity:0;
}

.particle{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100px);
    }
}

.clicked .text{
    animation:zoomOut 2s forwards;
}

.clicked .landscape{
    bottom:0;
}

.clicked .sun{
    opacity:1;
    animation:sunrise 3s ease forwards;
}

@keyframes sunrise{
    from{
        transform:translate(-50%,150px);
    }
    to{
        transform:translate(-50%,0);
    }
}

@keyframes zoomOut{
    to{
        transform:scale(1.8);
        opacity:0;
        letter-spacing:10px;
    }
}

.hint{
    position:absolute;
    bottom:30px;
    color:white;
    font-size:1rem;
    opacity:.8;
}
</style>
</head>

<body>

<div class="scene" id="scene">

    <div class="sun"></div>

    <div class="text">
        Hey Gauhar,<br>
        How You Doing?
    </div>

    <div class="landscape"></div>

    <div class="hint">
        Click anywhere ✨
    </div>

</div>

<script>
const scene = document.getElementById("scene");

for(let i=0;i<60;i++){
    let p=document.createElement("div");
    p.classList.add("particle");
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(5+Math.random()*8)+"s";
    p.style.animationDelay=Math.random()*5+"s";
    scene.appendChild(p);
}

document.body.addEventListener("click",()=>{
    scene.classList.add("clicked");
});
</script>

</body>
</html>
