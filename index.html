<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    scroll-behavior:smooth;
    overflow-y:scroll;
}

section{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    text-align:center;
}

.hero{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#06b6d4);
}

.friends{
    background:linear-gradient(135deg,#7c3aed,#ec4899);
}

.final{
    background:linear-gradient(135deg,#059669,#10b981);
}

h1{
    font-size:4rem;
    opacity:0;
    transform:translateY(80px);
    transition:1s;
}

.show{
    opacity:1;
    transform:translateY(0);
}

.arrow{
    margin-top:30px;
    font-size:2rem;
    animation:bounce 1.5s infinite;
}

@keyframes bounce{
    50%{
        transform:translateY(15px);
    }
}

button{
    margin-top:25px;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    font-size:1.1rem;
    cursor:pointer;
}
</style>
</head>
<body>

<section class="hero">
    <h1 class="animate">Hey Gauhar 👋<br>How you doing?</h1>
    <div class="arrow">⬇ Scroll Down</div>
</section>

<section class="friends">
    <h1 class="animate">💖 Wanna Be Friends?</h1>
    <button onclick="friendAccepted()">
        Yes 😊
    </button>
</section>

<section class="final">
    <h1 id="finalText">✨ Waiting For Your Answer ✨</h1>
</section>

<script>
const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add('show');
        }
    });
});

document.querySelectorAll('.animate').forEach(el=>{
    observer.observe(el);
});

function friendAccepted(){
    document.getElementById('finalText').innerHTML =
    "🎉 Yay! Let's Be Friends! 🎉";
    document.querySelector('.final')
        .scrollIntoView({behavior:'smooth'});
}
</script>

</body>
</html>
