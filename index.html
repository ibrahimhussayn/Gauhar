<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Gauhar ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    overflow-y:auto;
    scroll-snap-type:y mandatory;
}

/* Sections */

section{
    height:100vh;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    scroll-snap-align:start;
    overflow:hidden;
}

/* First Screen */

.hero{
    background:linear-gradient(135deg,#0f172a,#2563eb,#38bdf8);
}

.hero h1{
    color:white;
    font-size:4rem;
    text-align:center;
    animation:fadeUp 1.5s ease forwards;
}

.scroll{
    color:white;
    margin-top:30px;
    font-size:1.2rem;
    animation:bounce 1.5s infinite;
}

/* Second Screen */

.friends{
    position:relative;
    background:linear-gradient(135deg,#7c3aed,#ec4899);
}

.friends h1{
    color:white;
    font-size:4rem;
    text-align:center;
    z-index:2;
    animation:fadeUp 1.5s ease forwards;
}

/* Hearts */

.heart{
    position:absolute;
    color:white;
    font-size:30px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    to{
        transform:translateY(-100px);
        opacity:1;
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes bounce{
    50%{
        transform:translateY(10px);
    }
}

/* Mobile */

@media(max-width:768px){
    .hero h1,
    .friends h1{
        font-size:2.5rem;
        padding:20px;
    }
}
</style>
</head>
<body>

<section class="hero">
    <h1>Hey Gauhar 👋<br>How You Doing?</h1>
    <div class="scroll">⬇ Scroll Down ⬇</div>
</section>

<section class="friends">
    <h1>💖 Wanna Be Friends? 💖</h1>
</section>

<script>

// Create floating hearts

const friends = document.querySelector(".friends");

for(let i=0;i<30;i++){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "❤️";

    heart.style.left = Math.random()*100 + "%";

    heart.style.animationDuration =
        (4 + Math.random()*5) + "s";

    heart.style.animationDelay =
        Math.random()*3 + "s";

    friends.appendChild(heart);
}
</script>

</body>
</html>
